 # Basics

DESIGN_NAME: manual_macro_placement_test
VERILOG_FILES: dir::src/*.v
CLOCK_PERIOD: 10
CLOCK_PORT: 
- clk1
- clk2
PNR_SDC_FILE: dir::src/impl.sdc
SIGNOFF_SDC_FILE: dir::src/signoff.sdc
EXTRA_LEFS: dir::src/*.lef
EXTRA_GDS_FILES: dir::src/*.gds
MACRO_PLACEMENT_CFG: ./macro_placement.cfg    

# Pin Order
IO_PIN_ORDER_CFG: dir::pin_order.cfg

# Floorplan & Dynamic Utilization
FP_SIZING: "absolute"
DIE_AREA: [0, 0, 330, 330]
CORE_AREA: [10, 10, 320, 320]

# PDN 
FP_ASPECT_RATIO: 1.0
FP_PDN_CORE_RING: true
FP_PDN_VOFFSET: 5
FP_PDN_HOFFSET: 5
FP_PDN_VWIDTH: 2
FP_PDN_HWIDTH: 2
FP_PDN_VPITCH: 30
FP_PDN_HPITCH: 30
FP_PDN_SKIPTRIM: true

# Placement Configurations
PL_TARGET_DENSITY: 0.8
PL_TIME_DRIVEN: true
PL_ROUTABILITY_DRIVEN: true
PL_RESIZER_TIMING_OPTIMIZATION: true
GPL_CELL_PADDING: 0
DPL_CELL_PADDING: 0

# Technology-Specific Configs
pdk::sky130*:
  CLOCK_PERIOD: 10.0
  scl::sky130_fd_sc_hs:
    CLOCK_PERIOD: 8
  scl::sky130_fd_sc_ls:
    MAX_FANOUT_CONSTRAINT: 5
pdk::gf180mcu*:
  CLOCK_PERIOD: 24.0
  FP_CORE_UTIL: 38
  MAX_FANOUT_CONSTRAINT: 4
  PL_TARGET_DENSITY: 0.5 
