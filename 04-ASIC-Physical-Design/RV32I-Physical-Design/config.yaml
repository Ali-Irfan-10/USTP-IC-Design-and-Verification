DESIGN_NAME: topmodule
VERILOG_FILES: dir::src/*.v

# --- CLOCK & TIMING ---
CLOCK_PORT: clk
CLOCK_PERIOD: 12.0
IO_DELAY_CONSTRAINT: 10
PNR_SDC_FILE: dir::src/impl.sdc
SIGNOFF_SDC_FILE: dir::src/signoff.sdc

# --- SYNTHESIS (Max Speed) ---
SYNTH_STRATEGY: "DELAY 0"
SYNTH_ABC_BUFFERING: true
SYNTH_SIZING: true
MAX_FANOUT_CONSTRAINT: 8

# --- FLOORPLANNING & AREA OPTIMIZATION ---
FP_SIZING: "relative"
FP_CORE_UTIL: 58
FP_ASPECT_RATIO: 1.0

# PDN Configuration (Updated Variable Names)
PDN_CORE_RING: true
PDN_VOFFSET: 5
PDN_HOFFSET: 5
PDN_VWIDTH: 2
PDN_HWIDTH: 2
PDN_VPITCH: 30
PDN_HPITCH: 30
PDN_SKIPTRIM: true

# --- CTS CONFIGURATION ---
CTS_ROOT_BUFFER: sky130_fd_sc_hd__clkbuf_8
CTS_CLK_BUFFERS:
  - sky130_fd_sc_hd__clkbuf_4
  - sky130_fd_sc_hd__clkbuf_8
  - sky130_fd_sc_hd__clkbuf_16

# --- PLACEMENT & ROUTING ---
PL_TARGET_DENSITY_PCT: 60
PL_TIMING_DRIVEN: true
PL_ROUTABILITY_DRIVEN: true
GPL_CELL_PADDING: 1
DPL_CELL_PADDING: 1

# IO Pin Order
IO_PIN_ORDER_CFG: dir::pin_order.cfg

# PDK Overrides
pdk::sky130*:
  FP_CORE_UTIL: 58
  CLOCK_PERIOD: 12.0
  MAX_FANOUT_CONSTRAINT: 8
  MAX_TRANSITION_CONSTRAINT: 0.75
  scl::sky130_fd_sc_hd:
    CLOCK_PERIOD: 12.0
